<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forward counting — Math4Kids</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="myNav navbar py-3">
  <div class="container-lg d-flex flex-wrap align-items-center justify-content-center justify-content-md-between gap-3">
    <a class="navbar-brand kids-brand mb-0 text-center" href="./index.html">
      <i class="fa-solid fa-rocket me-2" aria-hidden="true"></i>MATH<b>4</b>KIDS<i class="fa-solid fa-rocket ms-2" aria-hidden="true"></i>
    </a>
    <a href="./index.html" class="btn btn-home btn-lg rounded-pill">
      <i class="fa-solid fa-house me-1" aria-hidden="true"></i> Home
    </a>
  </div>
</nav>

<div  >
<script>
var start = parseInt(prompt("Enter Starting number:"), 10);
var end = parseInt(prompt("Enter Ending number:"), 10);

if (isNaN(start) || isNaN(end) || start > end) {
    alert("Please enter valid starting and ending numbers.");
     document.writeln(`<div class="d-flex align-items-center justify-content-center">
     <div class="card animate__animated animate__backInDown kids-result-card">
       <img src="https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExdTRwbmdvcnVuc3F2Yzk5dzJmMjk4bW54cWIxZ3I5NWxwcHVld2w3bSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/CoND5j6Bn1QZUgm1xX/giphy.gif" class="card-img-top animate__animated animate__backInLeft" alt="">
       <div class="card-body animate__animated animate__backInRight kids-card-body-pattern">
         <h5 class="card-title"> ⚠️ Invalid Range!</h5>
         <p class="card-text">Please refresh and try again.</p>
       </div>
     </div>
   </div>`);
} else {
    document.writeln(`<div class="kids-num-wrap animate__animated animate__fadeInUp">`);
    for (var i = start; i <= end; i++) {
        document.writeln(
            `<div class="kids-num-bubble animate__animated animate__zoomIn">${i}</div>`
        );
    }
    document.writeln("</div>");
}
</script>
</div>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
</body>
</html>
