<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime numbers — Math4Kids</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="myNav navbar py-3">
  <div class="container-lg d-flex flex-wrap align-items-center justify-content-center justify-content-md-between gap-3">
    <a class="navbar-brand kids-brand mb-0 text-center" href="./index.html">
      <i class="fa-solid fa-rocket me-2" aria-hidden="true"></i>MATH<b>4</b>KIDS<i class="fa-solid fa-rocket ms-2" aria-hidden="true"></i>
    </a>
    <a href="./index.html" class="btn btn-home btn-lg rounded-pill">
      <i class="fa-solid fa-house me-1" aria-hidden="true"></i> Home
    </a>
  </div>
</nav>

<div  >
<script>
     var num = Number(prompt("Enter a number:"));
     var isPrime = true;
     if (!num) {
      alert("Enter a valid number")
     }
     else if (num <= 1 ) {
       isPrime = false;
     } else {
        for (let i = 2; i < num; i++) {
            if (num % i === 0) {
             isPrime = false;
             break;
            }
        }
     }
     if (!num ){
      document.writeln(`<div class="d-flex align-items-center justify-content-center">
     <div class="card animate__animated animate__backInDown kids-result-card">
       <img src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExZHp5MnpyeWtxdXkyYzdlMDFoa2NmcmdibncyM216ZHh2aDR2YXU1diZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/55cX2zvcUP1vMlNIMF/giphy.gif" class="card-img-top animate__animated animate__backInLeft" alt="">
       <div class="card-body animate__animated animate__backInRight kids-card-body-pattern">
         <h5 class="card-title">${num} is not a number</h5>
         <p class="card-text mb-0">Try another number and see!</p>
       </div>
     </div>
   </div>`);
}

    else if (isPrime) {
      document.writeln(`<div class="d-flex align-items-center justify-content-center">
     <div class="card animate__animated animate__backInDown kids-result-card">
       <img src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExbG13MThueGFpN3F4OXpwanYycHZhZmV5cmZibzI5bm81OWVncWFrbiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/4Q1P4sBSgat57euMGz/giphy.gif" class="card-img-top animate__animated animate__backInLeft" alt="">
       <div class="card-body animate__animated animate__backInRight kids-card-body-pattern">
         <h5 class="card-title">${num} is a prime number</h5>
         <p class="card-text"><b>Prime numbers:</b> too unique to be divided (except by 1 and themselves).</p>
       </div>
     </div>
   </div>`);
   
} 

else {
      document.writeln(`<div class="d-flex align-items-center justify-content-center">
     <div class="card animate__animated animate__backInDown kids-result-card">
       <img src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExZHp5MnpyeWtxdXkyYzdlMDFoa2NmcmdibncyM216ZHh2aDR2YXU1diZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/55cX2zvcUP1vMlNIMF/giphy.gif" class="card-img-top animate__animated animate__backInLeft" alt="">
       <div class="card-body animate__animated animate__backInRight kids-card-body-pattern">
         <h5 class="card-title">${num} is not a prime number</h5>
         <p class="card-text mb-0">Try another number and see!</p>
       </div>
     </div>
   </div>`);
}
</script>
</div>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
</body>
</html>
