 <nav class="myNav navbar ">

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>



<script>
     var num = parseInt(prompt("Enter a number:"));
     var isPrime = true
     if (num <= 1) {
       isPrime = false; 
     } else {
        for (let i = 2; i <num; i++) {
if (num % i === 0) {
             isPrime = false;
             break
}            
        }
     }

     if (isPrime) {
      document.writeln(` <div class="d-flex align-items-center justify-content-center">

     <div class="card animate__animated animate__backInDown" style="width: 40%;margin-top: 20px; ">
       <img src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExbG13MThueGFpN3F4OXpwanYycHZhZmV5cmZibzI5bm81OWVncWFrbiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/4Q1P4sBSgat57euMGz/giphy.gif" class="card-img-top animate__animated animate__backInLeft"  alt="...">
       <div class="card-body animate__animated animate__backInRight" 
     
>
         <h5 class="card-title">${num} is a Prime number </h5>
         <p class="card-text"><b>Prime Numbers:</b>  Too unique to be divided</p>
       </div>
     </div>


   </div>`)
} else {
      document.writeln(` <div class="d-flex align-items-center justify-content-center">

     <div class="card animate__animated animate__backInDown" style="width: 40%;margin-top: 20px; ">
       <img src="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExZHp5MnpyeWtxdXkyYzdlMDFoa2NmcmdibncyM216ZHh2aDR2YXU1diZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/55cX2zvcUP1vMlNIMF/giphy.gif" class="card-img-top animate__animated animate__backInLeft"  alt="...">
       <div class="card-body animate__animated animate__backInRight" 
     
>
         <h5 class="card-title">${num} is not a Prime number </h5>
         
       </div>
     </div>


   </div>`)
}
</script>
</body>
