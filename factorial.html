<script>
    var num = parseInt(prompt("Enter a number:"));
var factorail = 1

    if (num<0) {
   alert("Number Shiuld be Greater than 0 ")
} else {
   for (let i = 1; i <= num; i++) {
    factorail*=i
    
   }
   alert("Factorial of "+num + " is "+factorail);
}

</script>
